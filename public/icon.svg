<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#4a7de0"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="160" y1="80" x2="160" y2="432" stroke="#333847" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="80" x2="240" y2="432" stroke="#333847" stroke-width="1.5" opacity="0.3"/>
  <line x1="320" y1="80" x2="320" y2="432" stroke="#333847" stroke-width="1.5" opacity="0.3"/>
  <line x1="400" y1="80" x2="400" y2="432" stroke="#333847" stroke-width="1.5" opacity="0.3"/>
  <!-- Today line -->
  <line x1="280" y1="70" x2="280" y2="442" stroke="#5b8def" stroke-width="2.5" opacity="0.35"/>
  <!-- Gantt bars -->
  <rect x="100" y="100" width="220" height="44" rx="10" fill="url(#bar1)" opacity="0.9"/>
  <rect x="100" y="100" width="140" height="44" rx="10" fill="url(#bar1)"/>
  <rect x="160" y="180" width="200" height="44" rx="10" fill="url(#bar2)" opacity="0.9"/>
  <rect x="160" y="180" width="200" height="44" rx="10" fill="url(#bar2)"/>
  <rect x="120" y="260" width="280" height="44" rx="10" fill="url(#bar3)" opacity="0.9"/>
  <rect x="120" y="260" width="170" height="44" rx="10" fill="url(#bar3)"/>
  <rect x="240" y="340" width="180" height="44" rx="10" fill="url(#bar4)" opacity="0.9"/>
  <rect x="240" y="340" width="80" height="44" rx="10" fill="url(#bar4)"/>
  <!-- Milestone diamond -->
  <polygon points="430,202 444,216 430,230 416,216" fill="#f59e0b"/>
  <!-- Dependency arrow -->
  <path d="M320 122 L340 122 L340 200 L360 200" fill="none" stroke="#5c6178" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="358,194 370,200 358,206" fill="#5c6178"/>
  <!-- Checkmark on first bar -->
  <path d="M118 118 L128 130 L148 110" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
